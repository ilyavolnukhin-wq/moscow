<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КХЛ Плей-офф: Сетка</title>
    
    <!-- PWA Настройки -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        /* ТЕМНАЯ ТЕМА */
        :root {
            --bg-color: #121212;         
            --text-color: #e5e7eb;       
            --border-color: #374151;     
            --winner-bg: #10b981;        
            --winner-text: white;
            --card-bg: #1f2937;          
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center;
        }

        /* Блок с инструкцией */
        .instruction-section {
            background: var(--card-bg); 
            padding: 15px; border-radius: 12px;
            margin-bottom: 15px; width: 100%; max-width: 600px; box-sizing: border-box;
            border: 1px solid var(--border-color); text-align: center;
        }
        
        .instruction-section h3 { margin-top: 0; font-size: 16px; color: #3b82f6; }
        .instruction-section p { font-size: 13px; color: #9ca3af; margin-bottom: 0; line-height: 1.4; }
        
        /* Место для Видео */
        .gif-container video {
            width: 100%; max-width: 300px; border-radius: 8px; 
            border: 1px solid var(--border-color); margin-bottom: 10px;
            display: inline-block;
        }

        .upload-section {
            background: var(--card-bg); padding: 15px; border-radius: 12px;
            margin-bottom: 15px; border: 1px solid var(--border-color);
            text-align: center; width: 100%; max-width: 600px; box-sizing: border-box;
        }
        
        .upload-section input[type="file"] {
            margin-bottom: 10px; padding: 10px; border: 1px dashed var(--border-color);
            width: 100%; border-radius: 6px; box-sizing: border-box;
            color: var(--text-color); background-color: #111827;
        }
        
        .status { font-weight: bold; color: #3b82f6; margin-top: 10px; font-size: 14px; white-space: pre-wrap;}
        
        .debug-box { 
            display: none; background: #000; color: #00ff00; padding: 10px; 
            font-family: monospace; font-size: 10px; max-height: 200px; overflow-y: auto;
            width: 100%; box-sizing: border-box; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #333;
        }
        
        .bracket-container {
            display: flex; gap: 30px; overflow-x: auto; padding: 15px;
            background: var(--card-bg); border-radius: 12px; 
            border: 1px solid var(--border-color);
            width: 100%; box-sizing: border-box; min-height: 500px;
        }
        
        .round {
            display: flex; flex-direction: column; justify-content: space-around;
            width: 160px; position: relative; min-height: 700px; flex-shrink: 0;
        }
        
        .round-title {
            text-align: center; font-weight: bold; margin-bottom: 10px;
            text-transform: uppercase; font-size: 0.7rem; color: #9ca3af;
            position: absolute; top: 0; width: 100%;
        }
        
        .match {
            display: flex; flex-direction: column; border: 1px solid var(--border-color);
            border-radius: 6px; overflow: hidden; margin: 5px 0; background: #111827;
            position: relative; z-index: 2;
        }
        
        .team {
            padding: 8px 10px; cursor: pointer; border: none; background: none;
            text-align: left; font-size: 11px; font-weight: 500; transition: all 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--text-color);
        }
        
        .team:first-child { border-bottom: 1px solid var(--border-color); }
        .team:hover { background-color: #374151; }
        
        .team.winner { 
            background-color: var(--winner-bg); 
            color: var(--winner-text); 
            font-weight: bold; 
        }
        .team.winner:hover { background-color: #059669; }
        
        .team.empty { color: #6b7280; cursor: default; font-style: italic; background-color: #1f2937; }
        .team.empty:hover { background-color: #1f2937; }
        
        #r1 .match { margin: 15px 0; }
        #r2 .match { margin: 55px 0; }
        #r3 .match { margin: 135px 0; }
        #r4 .match { margin: 0; margin-top: 230px; }
        
        button.reset-btn { 
            padding: 10px 20px; background-color: #ef4444; color: white; 
            border: none; border-radius: 6px; cursor: pointer; display: none; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- БЛОК С ИНСТРУКЦИЕЙ (ВИДЕО) -->
    <div class="instruction-section" id="instructionSection">
        <h3>Как это работает?</h3>
        
        <div class="gif-container">
            <!-- Используем тег video для MP4 -->
            <video src="instruction.mp4" autoplay loop muted playsinline></video>
        </div>

        <p>
            1. Сделайте скриншот таблицы в приложении КХЛ.<br>
            2. Нажмите кнопку ниже и выберите этот скриншот.<br>
            3. Дождитесь распознавания и кликайте по победителям!
        </p>
    </div>

    <div class="upload-section" id="uploadSection">
        <h2 style="font-size: 18px; margin-top:0;">Загрузите скриншот</h2>
        <input type="file" id="imageInput" accept="image/*">
        <div class="status" id="status">Выберите картинку из галереи</div>
    </div>

    <pre class="debug-box" id="debugBox"></pre>

    <div class="controls">
        <button class="reset-btn" id="resetBtn" onclick="resetBracket()">Начать заново</button>
    </div>

    <div class="bracket-container" id="bracket"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW зарегистрирован'))
                    .catch(err => console.log('Ошибка SW: ', err));
            });
        }

        let bracketData = { west: [], east: [] };
        let state = { r1: [], r2: [], r3: [], r4: [] };

        const statusDiv = document.getElementById('status');
        const debugBox = document.getElementById('debugBox');
        const imageInput = document.getElementById('imageInput');
        const resetBtn = document.getElementById('resetBtn');
        const instructionSection = document.getElementById('instructionSection');

        function preprocessImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = 1.5;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                        if (brightness < 128) {
                            data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                        } else {
                            data[i] = 0; data[i+1] = 0; data[i+2] = 0;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = URL.createObjectURL(file);
            });
        }

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusDiv.innerText = "Обработка изображения...";
            statusDiv.style.color = "#3b82f6";
            debugBox.style.display = 'none';
            document.getElementById('bracket').innerHTML = '';

            try {
                const processedImage = await preprocessImage(file);
                const { data: { text } } = await Tesseract.recognize(processedImage, 'rus', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusDiv.innerText = `Сканирую: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });

                debugBox.innerText = "РАСПОЗНАННЫЙ ТЕКСТ:\n" + text;
                statusDiv.innerText = "Анализ данных...";
                parseStandings(text);

            } catch (error) {
                statusDiv.innerText = "Ошибка распознавания. Попробуйте еще раз.";
                statusDiv.style.color = "#ef4444";
            }
        });

        function parseStandings(rawText) {
            const lines = rawText.split('\n');
            let west = [];
            let east = [];
            let currentList = west; 

            const teamRegex = /^(\d{1,2})\s+([А-Яа-яA-Za-z\s\.\-]+?)(?=\s+\d|$)/;

            for (let line of lines) {
                line = line.trim();
                const match = line.match(teamRegex);

                if (match) {
                    const rank = parseInt(match[1]);
                    const teamName = match[2].trim();

                    if (rank >= 1 && rank <= 11 && teamName.length > 2) {
                        if (rank === 1 && west.length > 0) {
                            currentList = east;
                        }

                        if (!currentList.some(t => t.name === teamName)) {
                            currentList.push({ rank, name: teamName });
                        }
                    }
                }
            }

            west.sort((a, b) => a.rank - b.rank);
            east.sort((a, b) => a.rank - b.rank);

            bracketData.west = west.slice(0, 8);
            bracketData.east = east.slice(0, 8);

            if (bracketData.west.length < 8 || bracketData.east.length < 8) {
                statusDiv.innerText = `Найдено: Запад - ${bracketData.west.length}, Восток - ${bracketData.east.length}.\nЗагрузите картинку, где видны ОБЕ таблицы.`;
                statusDiv.style.color = "#ef4444";
                debugBox.style.display = 'block';
            } else {
                statusDiv.innerText = "Успешно! Сетка построена.";
                statusDiv.style.color = "#10b981";
                debugBox.style.display = 'none';
                instructionSection.style.display = 'none'; // Скрываем инструкцию
            }

            resetBtn.style.display = 'inline-block';
            document.getElementById('uploadSection').style.display = 'none';
            buildBracket();
        }

        function buildBracket() {
            const createPairs = (confTeams) => {
                const getT = (idx) => confTeams[idx] || null;
                return [
                    { t1: getT(0), t2: getT(7), w: null },
                    { t1: getT(1), t2: getT(6), w: null },
                    { t1: getT(2), t2: getT(5), w: null },
                    { t1: getT(3), t2: getT(4), w: null }
                ];
            };

            state.r1 = [ ...createPairs(bracketData.east), ...createPairs(bracketData.west) ];
            state.r2 = Array(4).fill(null).map(() => ({ t1: null, t2: null, w: null }));
            state.r3 = Array(2).fill(null).map(() => ({ t1: null, t2: null, w: null }));
            state.r4 = Array(1).fill(null).map(() => ({ t1: null, t2: null, w: null }));

            renderBracket();
        }

        function renderBracket() {
            const bracket = document.getElementById('bracket');
            bracket.innerHTML = '';
            const titles = ['1/8', '1/4 (Перекрест)', '1/2', 'Финал'];

            for (let r = 1; r <= 4; r++) {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round'; roundDiv.id = `r${r}`;
                
                const title = document.createElement('div');
                title.className = 'round-title'; title.innerText = titles[r-1];
                roundDiv.appendChild(title);

                state[`r${r}`].forEach((match, index) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    matchDiv.appendChild(createTeamBtn(r, index, 't1', match.t1, match.w));
                    matchDiv.appendChild(createTeamBtn(r, index, 't2', match.t2, match.w));
                    roundDiv.appendChild(matchDiv);
                });
                bracket.appendChild(roundDiv);
            }
        }

        function createTeamBtn(round, matchIndex, teamSlot, teamObj, winnerObj) {
            const btn = document.createElement('button');
            if (!teamObj) {
                btn.className = 'team empty'; btn.innerText = '...';
            } else {
                btn.className = 'team'; btn.innerText = teamObj.name;
                if (winnerObj && winnerObj.name === teamObj.name) btn.classList.add('winner');
                btn.onclick = () => selectWinner(round, matchIndex, teamObj);
            }
            return btn;
        }

        function selectWinner(round, matchIndex, teamObj) {
            const match = state[`r${round}`][matchIndex];
            if (match.w && match.w.name === teamObj.name) return;
            
            match.w = teamObj;

            if (round === 1) {
                state.r2.forEach(m => m.w = null);
                state.r3.forEach(m => m.w = null);
                state.r4.forEach(m => m.w = null);
            } else if (round === 2) {
                state.r3.forEach(m => m.w = null);
                state.r4.forEach(m => m.w = null);
            } else if (round === 3) {
                state.r4.forEach(m => m.w = null);
            }

            updateBracket();
            renderBracket();
        }

        function updateMatch(match, t1, t2) {
            if (!match.t1 || match.t1.name !== t1?.name || !match.t2 || match.t2.name !== t2?.name) {
                match.w = null;
            }
            match.t1 = t1;
            match.t2 = t2;
        }

        function updateBracket() {
            let eastWinners = state.r1.slice(0, 4).map(m => m.w).filter(w => w);
            let westWinners = state.r1.slice(4, 8).map(m => m.w).filter(w => w);

            if (eastWinners.length === 4 && westWinners.length === 4) {
                eastWinners.sort((a, b) => a.rank - b.rank);
                westWinners.sort((a, b) => a.rank - b.rank);

                const E1 = eastWinners[0], E2 = eastWinners[1], E3 = eastWinners[2], E4 = eastWinners[3];
                const W1 = westWinners[0], W2 = westWinners[1], W3 = westWinners[2], W4 = westWinners[3];

                updateMatch(state.r2[0], W1, E4);
                updateMatch(state.r2[1], W2, E3);
                updateMatch(state.r2[2], E1, W4);
                updateMatch(state.r2[3], E2, W3);
            } else {
                state.r2.forEach(m => { m.t1 = null; m.t2 = null; m.w = null; });
            }

            if (state.r2[0].w && state.r2[1].w) {
                updateMatch(state.r3[0], state.r2[0].w, state.r2[1].w);
            } else {
                state.r3[0].t1 = null; state.r3[0].t2 = null; state.r3[0].w = null;
            }

            if (state.r2[2].w && state.r2[3].w) {
                updateMatch(state.r3[1], state.r2[2].w, state.r2[3].w);
            } else {
                state.r3[1].t1 = null; state.r3[1].t2 = null; state.r3[1].w = null;
            }

            if (state.r3[0].w && state.r3[1].w) {
                updateMatch(state.r4[0], state.r3[0].w, state.r3[1].w);
            } else {
                state.r4[0].t1 = null; state.r4[0].t2 = null; state.r4[0].w = null;
            }
        }

        function resetBracket() {
            document.getElementById('instructionSection').style.display = 'block'; 
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('bracket').innerHTML = '';
            imageInput.value = '';
            statusDiv.innerText = 'Выберите картинку из галереи';
            statusDiv.style.color = '#3b82f6';
            resetBtn.style.display = 'none';
            debugBox.style.display = 'none';
        }
    </script>
</body>
</html>
