function render(){
  let out="";
  for(let d=1;d<=4;d++){
    let items=D[d].map((x,i)=>`<div class="item" id="i-${d}-${i}">
      <div class="time">${x.time}</div>
      <div class="card">
        <div class="title">${x.title}</div>
        <div class="note">${x.note}</div>
        ${x.metro?`<div class="route">${x.metro}</div>`:''}
        ${x.walk?`<div class="route walk">${x.walk}</div>`:''}
        <span class="status ${localStorage.getItem(`done-${d}-${i}`)?'ok':''}" id="s-${d}-${i}">${localStorage.getItem(`done-${d}-${i}`)?'✓ выполнено':'запланировано'}</span>
        <div class="actions">
          ${x.map?`<a class="btn map" target="_blank" href="${x.map}">🗺️ Открыть</a>`:''}
          ${x.buy?`<a class="btn buy" target="_blank" href="${x.buy}">🎟️ Билеты</a>`:''}
          <button class="btn done" onclick="complete(${d},${i})">☑️ Выполнено</button>
        </div>
      </div>
    </div>`).join("");
    const title = d===1?'🎂 День рождения':d===2?'🏙️ Москва-Сити + Планетарий':d===3?'⚛️ АТОМ + Бункер-42 + RA’MEN':'❤️ Красная площадь + ЦДМ';
    const sub = d===1?'Прибытие → отель → РГДБ → Парк Горького → ужин':d===2?'Высота → Лунариум → ужин → бассейн':d===3?'Наука → секретная миссия → аниме-ужин':'Москва → покупки → поезд';
    out+=`<section class="day ${d===1?'active':''}" id="d${d}"><div class="summary"><h2>${title}</h2><div class="muted">${sub}</div><div class="progress"><i id="p${d}"></i></div></div>${items}</section>`;
  }
  document.getElementById("days").innerHTML=out;
  progress();ticketsInfo();
}

function day(n){
  cur=n;
  document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
  document.getElementById("d"+n).classList.add("active");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab")[n-1].classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  nextLabel();
}

function complete(d,i){
  localStorage.setItem(`done-${d}-${i}`,"1");
  const s=document.getElementById(`s-${d}-${i}`);
  if(s){s.textContent="✓ выполнено";s.className="status ok"}
  progress();
}

function progress(){
  for(let d=1;d<=4;d++){
    let n=D[d].filter((_,i)=>localStorage.getItem(`done-${d}-${i}`)).length;
    const p=document.getElementById("p"+d);
    if(p)p.style.width=(n/D[d].length*100)+"%";
    D[d].forEach((_,i)=>{
      let s=document.getElementById(`s-${d}-${i}`);
      if(s&&localStorage.getItem(`done-${d}-${i}`)){s.textContent="✓ выполнено";s.className="status ok"}
    });
  }
}

function tickets(){
  open(`<h2>🎟️ Билеты и брони</h2>${T.map((x,i)=>`<div class="ticket"><label><input type="checkbox" ${localStorage.getItem("t"+i)?"checked":""} onchange="localStorage.setItem('t${i}',this.checked?'1':'');ticketsInfo()"> <b>${x[0]}</b><br><span class="muted">${x[1]}</span></label><a class="btn buy" target="_blank" href="${x[2]}">Открыть</a></div>`).join("")}`)
}

function ticketsInfo(){
  let n=T.filter((_,i)=>localStorage.getItem("t"+i)).length;
  document.getElementById("tc").textContent=n+"/5 отмечено";
}

function budget(){
  open(`<h2>💰 Бюджет</h2><p class="muted">Сохраняется на этом устройстве.</p><input id="bi" value="${localStorage.getItem("budget")||""}" placeholder="например 35000 ₽" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px"><button class="btn" style="margin-top:10px" onclick="localStorage.setItem('budget',document.getElementById('bi').value);closeM();budgetInfo()">Сохранить</button>`)
}

function budgetInfo(){document.getElementById("bc").textContent=localStorage.getItem("budget")||"не задан"}

function maps(){
  open(`<h2>🗺️ Маршруты дня ${cur}</h2><p class="muted">Открывай точки по порядку.</p>${D[cur].filter(x=>x.map).map(x=>`<p><a class="btn map" target="_blank" href="${x.map}">${x.time} — ${x.title}</a></p>`).join("")}`)
}

function now(){
  let arr=D[cur],mins=new Date().getHours()*60+new Date().getMinutes(),
  idx=arr.findIndex(x=>{let [h,m]=x.time.split(":").map(Number);return h*60+m>mins});
  if(idx<0)idx=0;
  const el=document.getElementById(`i-${cur}-${idx}`);
  if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
}

function nextLabel(){
  let mins=new Date().getHours()*60+new Date().getMinutes(),
  x=D[cur].find(x=>{let [h,m]=x.time.split(":").map(Number);return h*60+m>mins});
  document.getElementById("next").textContent=x?"следующий: "+x.time:"день завершён";
}

function open(s){document.getElementById("mb").innerHTML=s;document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show")}

function tick(){
  let n=new Date();
  document.getElementById("clock").textContent=n.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  nextLabel();
}
setInterval(tick,30000);

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").classList.add("show")});
document.getElementById("installBtn").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};

render();budgetInfo();tick();
</script>
</body></html>
